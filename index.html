<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUROKAZE</title>
</head>
<body>
  <h1>KUROKAZE</h1>
  <p>
    Created by
    <a href="https://github.com/Mid-NIGHTSHARK" target="_blank" rel="noopener">Mid-NIGHTSHARK</a>
    &amp;
    <a href="https://github.com/Cran7ax" target="_blank" rel="noopener">Dev Parmar (@Cran7ax)</a>
  </p>

  <h3>Available Experiences</h3>
  <ul id="list">
    <li>Loading files...</li>
  </ul>

  <p>
    <small>
      Server: <a id="ws" href="/api/ws" target="_blank" rel="noopener">checking...</a>
      |
      <a href="#" id="refresh">Refresh list</a>
    </small>
  </p>

  <script>
    const OWNER = "Mid-NIGHTSHARK";
    const REPO = "KUROKAZE";
    const CACHE_KEY = "kurokaze_plain_list_v1";
    const CACHE_TTL = 60000;

    const listEl = document.getElementById("list");
    const refreshEl = document.getElementById("refresh");
    const wsEl = document.getElementById("ws");

    const UPPER = new Set(["kurokaze", "ii", "iii", "iv", "v", "2p", "p2p", "ws", "ki"]);

    function formatName(filename) {
      return filename
        .replace(/\.html?$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .split(" ")
        .map((w) => UPPER.has(w.toLowerCase()) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))
        .join(" ");
    }

    function render(files) {
      listEl.innerHTML = "";
      if (!files.length) {
        const li = document.createElement("li");
        li.textContent = "No HTML files found.";
        listEl.appendChild(li);
        return;
      }

      files
        .slice()
        .sort((a, b) => a.localeCompare(b))
        .forEach((name) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "./" + encodeURIComponent(name);
          a.textContent = formatName(name);
          li.appendChild(a);
          listEl.appendChild(li);
        });
    }

    async function loadFiles(force) {
      let cached = null;
      try {
        cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      } catch {}

      if (!force && cached && Array.isArray(cached.files) && Date.now() - cached.ts < CACHE_TTL) {
        render(cached.files);
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents`, {
          headers: { Accept: "application/vnd.github+json" },
          cache: "no-store"
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const items = await res.json();
        const files = items
          .filter((item) => item.type === "file" && /\.html?$/i.test(item.name) && item.name.toLowerCase() !== "index.html")
          .map((item) => item.name);

        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), files }));
        } catch {}

        render(files);
      } catch (err) {
        if (cached && Array.isArray(cached.files)) {
          render(cached.files);
        } else {
          listEl.innerHTML = "";
          const li = document.createElement("li");
          li.textContent = "Could not load file list (" + err.message + ").";
          listEl.appendChild(li);
        }
      }
    }

    refreshEl.addEventListener("click", (e) => {
      e.preventDefault();
      listEl.innerHTML = "<li>Refreshing...</li>";
      loadFiles(true);
    });

    loadFiles(false);

    fetch("/api/ws", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((d) => { wsEl.textContent = d && d.ok ? (d.mode || "online") : "error"; })
      .catch(() => { wsEl.textContent = "offline"; });
  </script>
</body>
</html>
